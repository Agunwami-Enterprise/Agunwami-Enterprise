name: Deploy to Namecheap

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Application
        run: npm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'agunwami_enterprise_ae_workstation_secret_key_2026_super_secure' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyBinzrMIqO16uxZrBToc-JO5spxAz6_E04' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'agunwami-enterprise.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'agunwami-enterprise' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'agunwami-enterprise.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '838884099596' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:838884099596:web:f4ccc1e79555bd1ee45029' }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || 'G-Q39DQ9CSR8' }}
          NEXT_PUBLIC_WORKSTATION_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_WORKSTATION_FIREBASE_API_KEY || 'AIzaSyDCgDKKuLjCQE2V9O2uJ-2-MTjdONnoeM0' }}
          NEXT_PUBLIC_WORKSTATION_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_WORKSTATION_FIREBASE_AUTH_DOMAIN || 'aehub-eafa6.firebaseapp.com' }}
          NEXT_PUBLIC_WORKSTATION_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WORKSTATION_FIREBASE_PROJECT_ID || 'aehub-eafa6' }}
          NEXT_PUBLIC_WORKSTATION_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_WORKSTATION_FIREBASE_STORAGE_BUCKET || 'aehub-eafa6.firebasestorage.app' }}
          NEXT_PUBLIC_WORKSTATION_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_WORKSTATION_FIREBASE_MESSAGING_SENDER_ID || '511641141289' }}
          NEXT_PUBLIC_WORKSTATION_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_WORKSTATION_FIREBASE_APP_ID || '1:511641141289:web:a44d561dc1f9ab8e50dc38' }}
          NEXT_PUBLIC_WORKSTATION_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_WORKSTATION_FIREBASE_DATABASE_URL || 'https://aehub-eafa6-default-rtdb.firebaseio.com/' }}
          NEXT_PUBLIC_ENTERPRISE_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_ENTERPRISE_FIREBASE_API_KEY || secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyBinzrMIqO16uxZrBToc-JO5spxAz6_E04' }}
          NEXT_PUBLIC_ENTERPRISE_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_ENTERPRISE_FIREBASE_AUTH_DOMAIN || secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'agunwami-enterprise.firebaseapp.com' }}
          NEXT_PUBLIC_ENTERPRISE_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_ENTERPRISE_FIREBASE_PROJECT_ID || secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'agunwami-enterprise' }}
          NEXT_PUBLIC_ENTERPRISE_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_ENTERPRISE_FIREBASE_STORAGE_BUCKET || secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'agunwami-enterprise.firebasestorage.app' }}
          NEXT_PUBLIC_ENTERPRISE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_ENTERPRISE_FIREBASE_MESSAGING_SENDER_ID || secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '838884099596' }}
          NEXT_PUBLIC_ENTERPRISE_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_ENTERPRISE_FIREBASE_APP_ID || secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:838884099596:web:f4ccc1e79555bd1ee45029' }}
          NEXT_PUBLIC_ENTERPRISE_FIREBASE_DATABASE_URL: ${{ secrets.NEXT_PUBLIC_ENTERPRISE_FIREBASE_DATABASE_URL || '' }}

      - name: ♻️ Create Passenger Automatic Restart File
        run: |
          mkdir -p tmp
          echo "Deployed at $(date)" > tmp/restart.txt

      - name: 🚀 Sync Files to Namecheap via SFTP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 21098
          source: ".next/,public/,data/,package.json,server.js,next.config.ts,tmp/restart.txt"
          target: "./agunwami-app/"
